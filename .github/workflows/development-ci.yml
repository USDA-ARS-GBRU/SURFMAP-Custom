name: Development CI - test and auto-release

# On every push to `development`/`master` (and on PRs targeting them, as a
# pre-merge signal):
#   1. run the fast Parameters validation unit tests (no docker/R needed)
#   2. build the current Dockerfile (cached via GitHub Actions cache) and run
#      the functional CLI tests against it end-to-end (R/APBS/pdb2pqr/freesasa)
#
# Releasing is split in two, because `master` is a protected branch that only
# accepts changes through a pull request:
#
#   - `open-release-pr` (on a green push to `development`): if
#     surfmap/__init__.py's __VERSION__ was bumped (no matching `vX.Y.Z` tag
#     exists yet), opens a `development` -> `master` pull request for you to
#     review and merge. Nothing is published at this point.
#   - `release` (on a push to `master`, i.e. once you merge that PR): tags the
#     merged commit `vX.Y.Z` and creates a GitHub Release from it, which
#     triggers .github/workflows/release-assets.yml (release: published).
#
# If the version was not bumped, both jobs skip their steps cleanly (no
# duplicate-tag error, no failed job) - this is intentional: not every green
# push is meant to become a release.
#
# Note: the release PR is opened with the default GITHUB_TOKEN, and GitHub
# deliberately does not trigger new workflow runs for events raised by that
# token - so the PR itself will show no checks. That's harmless here: the very
# same commit was already tested by the `test` job on the `development` push.
# If you later enable "require status checks" on `master`, swap GITHUB_TOKEN
# for a PAT / GitHub App token so the PR gets its own checks.

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development, master]

permissions:
  contents: write
  pull-requests: write

env:
  # local-only image tag used to run the functional --docker tests against
  # the current commit's Dockerfile, without touching Docker Hub.
  DOCKER_REPOSITORY: surfmap
  SURFMAP_DOCKER_VERSION: ci-test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install surfmap (entry point only, --docker needs no [local] extras)
        run: pip install --no-cache-dir -e .

      - name: Run fast Parameters validation unit tests
        run: python -m unittest discover -s surfmap/tests -p "tests_parameters.py" -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache APBS binary distribution
        id: cache-apbs
        uses: actions/cache@v4
        with:
          path: softwares/APBS-3.4.1.Linux
          key: apbs-3.4.1-linux

      - name: Fetch APBS binary distribution (not tracked in git, see .gitignore)
        if: steps.cache-apbs.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o apbs.zip \
            https://github.com/Electrostatics/apbs/releases/download/v3.4.1/APBS-3.4.1.Linux.zip
          mkdir -p softwares
          unzip -q apbs.zip -d softwares
          rm apbs.zip

      - name: Patch known APBS psize.py bug (see i2bc/SURFMAP#18)
        run: |
          PSIZE=softwares/APBS-3.4.1.Linux/share/apbs/tools/manip/psize.py
          if grep -qF 'if nsmall <= 0:' "$PSIZE"; then
            echo "Found buggy 'if nsmall <= 0:' in $PSIZE - patching to 'if nsmall[i] <= 0:'"
            sed -i 's/if nsmall <= 0:/if nsmall\[i\] <= 0:/' "$PSIZE"
          else
            echo "$PSIZE already patched (or line not found) - no change needed."
          fi

      - name: Build surfmap docker image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.DOCKER_REPOSITORY }}:${{ env.SURFMAP_DOCKER_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run functional CLI tests against the built image
        run: python -m unittest discover -s surfmap/tests -p "tests_functional_docker.py" -v

  open-release-pr:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development (full history)
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine current version and whether it needs releasing
        id: version
        run: |
          # avoid `python setup.py --version`: it unconditionally imports
          # setuptools at module load time, which isn't guaranteed to be
          # present in every Python environment (e.g. 3.12+ venvs no longer
          # bundle it by default). Read __VERSION__ directly instead.
          VERSION=$(python -c "import surfmap; print(surfmap.__VERSION__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists on origin - version was not bumped, skipping release PR."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v$VERSION not found on origin - a release PR is needed."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open release pull request (development -> master)
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # an already-open development -> master PR automatically includes
          # this new commit, so only open one if none exists yet
          EXISTING=$(gh pr list --base master --head development --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING (development -> master) is already open and now includes this commit."
            gh pr edit "$EXISTING" --title "Release v$VERSION"
          else
            gh pr create --base master --head development \
              --title "Release v$VERSION" \
              --body "Automated release PR opened by \`development-ci.yml\`.

          \`__VERSION__\` is \`$VERSION\` and no \`v$VERSION\` tag exists yet.
          The tests already passed on this commit on \`development\`.

          Merging this PR will tag \`v$VERSION\` and publish a GitHub Release
          (which in turn triggers \`release-assets.yml\`).

          Remember the manual Docker Hub push afterwards - see CONTRIBUTING.md."
          fi

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master (full history)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine current version and whether it needs releasing
        id: version
        run: |
          # avoid `python setup.py --version`: it unconditionally imports
          # setuptools at module load time, which isn't guaranteed to be
          # present in every Python environment (e.g. 3.12+ venvs no longer
          # bundle it by default). Read __VERSION__ directly instead.
          VERSION=$(python -c "import surfmap; print(surfmap.__VERSION__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists on origin - nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v$VERSION not found on origin - will release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag the release
        if: steps.version.outputs.should_release == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}" "$(git rev-parse HEAD)"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: master
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
