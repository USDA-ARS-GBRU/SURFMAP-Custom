name: Publish release assets

# Builds an sdist archive whenever a GitHub Release is published, and uploads
# it as a release asset under two names:
#   - its natural versioned name (e.g. surfmap-2.2.1.tar.gz)
#   - a fixed name, surfmap-latest.tar.gz
#
# The fixed name lets the README reference a stable URL that always resolves
# to the newest published release, without ever bumping a version number in
# the docs:
#   https://github.com/i2bc/SURFMAP/releases/latest/download/surfmap-latest.tar.gz
#
# The workflow_dispatch trigger lets a maintainer backfill the asset on an
# already-published release (e.g. to run it once against the current release
# without having to cut a new one).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the built assets to (e.g. v2.2.1)"
        required: true

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Duplicate sdist under a stable filename
        run: |
          sdist_path=$(ls dist/*.tar.gz | head -n1)
          cp "$sdist_path" dist/surfmap-latest.tar.gz

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
